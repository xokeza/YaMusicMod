<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Фон: темный градиент -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f13" />
      <stop offset="50%" stop-color="#181824" />
      <stop offset="100%" stop-color="#09090c" />
    </linearGradient>

    <!-- Неоновый градиент для акцентов -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b2cbf" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#c77dff" />
    </linearGradient>

    <!-- Свечение -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Задний фон -->
  <rect width="1200" height="400" fill="url(#bg-grad)" />

  <!-- Декоративные размытые круги на фоне -->
  <circle cx="150" cy="80" r="180" fill="#7b2cbf" opacity="0.12" filter="blur(60px)" />
  <circle cx="1050" cy="320" r="220" fill="#9d4edd" opacity="0.1" filter="blur(80px)" />

  <!-- Стилизованное "активное окно" -->
  <g transform="translate(100, 75)">
    <!-- Контур окна -->
    <rect width="1000" height="250" rx="16" fill="#13131a" stroke="#2a2a38" stroke-width="2" />
    
    <!-- Шапка окна (TitleBar) -->
    <path d="M 0,16 A 16,16 0 0,1 16,0 L 984,0 A 16,16 0 0,1 1000,16 L 1000,50 L 0,50 Z" fill="#1c1c28" />
    <line x1="0" y1="50" x2="1000" y2="50" stroke="#2a2a38" stroke-width="1" />

    <!-- Левая часть шапки (Иконка приложения + Заголовок) -->
    <circle cx="30" cy="25" r="7" fill="url(#accent-grad)" />
    <rect x="48" y="21" width="90" height="8" rx="4" fill="#a0a0b0" opacity="0.4" />

    <!-- Кнопки управления TitleBar (Скрывающиеся/Прозрачные) -->
    <g opacity="0.35">
      <!-- Кнопка перезагрузки -->
      <path d="M 870,21 A 5,5 0 1,1 875,26 L 877,24" fill="none" stroke="#a0a0b0" stroke-width="2" stroke-linecap="round" />
      <!-- Свернуть -->
      <line x1="905" y1="25" x2="917" y2="25" stroke="#a0a0b0" stroke-width="2" stroke-linecap="round" />
      <!-- Развернуть -->
      <rect x="937" y="19" width="11" height="11" fill="none" stroke="#a0a0b0" stroke-width="2" rx="2" />
      <!-- Закрыть -->
      <path d="M 968,20 L 978,30 M 978,20 L 968,30" stroke="#a0a0b0" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Имитация контента окна (минималистичные полосы) -->
    <rect x="40" y="80" width="180" height="12" rx="6" fill="url(#accent-grad)" opacity="0.8" />
    <rect x="40" y="108" width="320" height="8" rx="4" fill="#2a2a3a" />
    <rect x="40" y="126" width="240" height="8" rx="4" fill="#2a2a3a" />

    <!-- Эффект курсора, проявляющего элементы -->
    <g transform="translate(840, 15)">
      <!-- Курсор мыши -->
      <path d="M0,0 L0,18 L4,14 L8,21 L11,19 L7,12 L13,12 Z" fill="#ffffff" filter="url(#glow)" />
    </g>

    <!-- Дополнительная кнопка полноэкранного режима (стрелочка вниз) -->
    <g transform="translate(940, 180)">
      <circle cx="20" cy="20" r="18" fill="#222230" stroke="#3a3a4c" stroke-width="1" />
      <path d="M 14,17 L 20,23 L 26,17" fill="none" stroke="url(#accent-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    </g>
  </g>

  <!-- Главный заголовок -->
  <text x="600" y="205" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    Hide TitleBar Buttons
  </text>

  <!-- Подзаголовок (Русский язык) -->
  <text x="600" y="240" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="500" font-size="16" fill="#9d4edd" text-anchor="middle" letter-spacing="3" opacity="0.9">
    АВТОСКРЫТИЕ И НАСТРОЙКА ПРОЗРАЧНОСТИ
  </text>
</svg>
